<!doctype html>
<title>정치경제 교재</title>
<style>
  /* Noto Sans KR embedded as base64 data: URIs (weights 400/500/700/900,
     Korean + Latin subsets) instead of loaded from Google Fonts. This
     print deliverable can't depend on a network fetch succeeding at
     measurement time — the pagination engine below measures real
     rendered text height to decide page breaks, and a font that swaps in
     AFTER that measurement (slow network, a blocked font CDN, print
     pipelines that don't fetch external resources at all) would silently
     invalidate every page break it already computed. Embedding makes
     rendering deterministic regardless of network conditions. */
  /*__FONT_FACES__*/
  /* ---------------- tokens (continuing 원고지 조판소's palette) ---------------- */
  :root{
    --bg:#EEF0F0;
    --surface:#FFFFFF;
    --surface-2:#F6F7F7;
    --border:#DADDDD;
    --ink:#20242C;
    --ink-soft:#5B6172;
    --ink-faint:#8B909C;
    --accent:#AE3728;
    --accent-ink:#FFFFFF;
    --accent-soft:#F3E1DD;
    --shadow: 0 1px 2px rgba(20,22,28,.06), 0 8px 24px rgba(20,22,28,.08);

    /* paper simulation — constant across themes, same as the exam-sheet artifact:
       this is a physical-paper mockup, not app chrome. */
    --paper:#FFFFFF;
    --paper-ink:#1B1E27;
    --paper-ink-soft:#6B6656;
    --paper-line:#C6564A;
    --paper-line-faint: rgba(198,86,74,.32);
    --paper-border:#B9B2A0;
    --paper-band: #F3EEE4;

    --font-display:'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --font-body:'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;

    --fs-xs:.75rem; --fs-sm:.8125rem; --fs-base:.9375rem; --fs-md:1.0625rem;
    --fs-lg:1.3rem; --fs-xl:1.7rem;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171B; --surface:#1C1F25; --surface-2:#22262D; --border:#31353D;
      --ink:#E9E7E1; --ink-soft:#A7ABB6; --ink-faint:#6E7280;
      --accent:#E2685A; --accent-ink:#20242C; --accent-soft:#3A2622;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171B; --surface:#1C1F25; --surface-2:#22262D; --border:#31353D;
    --ink:#E9E7E1; --ink-soft:#A7ABB6; --ink-faint:#6E7280;
    --accent:#E2685A; --accent-ink:#20242C; --accent-soft:#3A2622;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:var(--fs-base); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------------- shell ---------------- */
  .toolbar{
    height:56px; display:flex; align-items:center; gap:.75rem; padding:0 1.1rem;
    background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--shadow);
    position:sticky; top:0; z-index:5;
  }
  .brand{ display:flex; align-items:baseline; gap:.55rem; margin-right:auto; min-width:0; }
  .brand-mark{ font-family:var(--font-display); font-weight:700; font-size:1.05rem; letter-spacing:.01em; white-space:nowrap; }
  .brand-sub{ font-size:var(--fs-xs); color:var(--ink-faint); white-space:nowrap; display:none; }
  @media (min-width:640px){ .brand-sub{ display:inline; } }

  .nav-jump{ display:flex; align-items:center; gap:.3rem; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink); font-size:var(--fs-sm); font-weight:600;
    padding:.5rem .85rem; border-radius:7px; cursor:pointer;
    display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap;
    transition:background .12s, border-color .12s, transform .06s;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn:active{ transform:translateY(1px); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--ink); background:var(--surface-2); }

  /* ---------------- preview column ---------------- */
  .stage{
    background:
      radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    padding:2.4rem 1rem 6rem; display:flex; flex-direction:column; align-items:center; gap:2.1rem;
  }
  .page-frame{ flex:0 0 auto; }

  .page{
    width:210mm; height:297mm; flex:0 0 auto;
    background:var(--paper); color:var(--paper-ink);
    box-shadow:var(--shadow);
    position:relative; overflow:hidden;
    font-family:var(--font-body);
  }
  .page-inner{
    position:absolute; inset:0;
    padding: 19mm 15mm 17mm 25mm; /* extra left margin reserved for coil binding */
    display:flex; flex-direction:column;
  }

  .page-kicker{
    display:flex; justify-content:space-between; align-items:baseline; gap:4mm;
    font-size:8pt; color:var(--paper-ink-soft); letter-spacing:.02em;
    border-bottom:.75pt solid var(--paper-border); padding-bottom:2.6mm; margin-bottom:6mm;
    flex:0 0 auto;
  }
  .page-kicker .crumb b{ font-family:var(--font-display); color:var(--paper-ink); font-weight:700; }
  .page-kicker .crumb .sep{ margin:0 1.6mm; color:var(--paper-border); }
  .page-kicker .pageno{ font-variant-numeric:tabular-nums; }

  .page-content{ flex:1 1 auto; min-height:0; overflow:hidden; }
  /* Two EXPLICIT column divs (built and filled by the JS pagination engine
     below) instead of CSS column-count. A CSS multi-column box defaults to
     column-fill:balance, which redistributes content to minimize each
     column's height rather than filling column 1 to the page's actual
     capacity before spilling into column 2 — for short content it doesn't
     even split into two columns until the first column's un-split height
     would already exceed the page, and for content containing a
     break-inside:avoid block it can jump the required height up in a way
     that doesn't match reading order. Both cause the JS's simple "does the
     content's rendered height exceed the page's height" check to fire at
     the wrong point, which is what caused pages to end early with a
     mostly-blank second column, or overflowing content to be clipped
     instead of pushed to a new page. Plain block flow inside two sibling
     flex columns makes the container's own height a true, monotonic sum
     of what's actually been placed, so the existing height-based overflow
     check means what it says. */
  .cols-row{ display:flex; }
  .cols-row .col{ flex:1 1 0; min-width:0; }
  .cols-row .col-left{ padding-right:4.5mm; margin-right:4.5mm; border-right:.6pt solid var(--paper-border); }

  .page-footer{
    flex:0 0 auto; margin-top:5mm; padding-top:2.4mm;
    border-top:.75pt solid var(--paper-border);
    display:flex; justify-content:space-between;
    font-size:7.3pt; color:var(--paper-ink-soft); letter-spacing:.02em;
  }

  /* ---------------- body typography ---------------- */
  .part-banner{
    column-span:all; background:var(--paper-band);
    border-left:3px solid var(--accent);
    padding:4mm 6mm; margin:0 0 6mm; font-family:var(--font-display);
    font-weight:700; font-size:15pt; color:var(--paper-ink); letter-spacing:.01em;
    break-after:avoid-column;
  }

  .l1{
    column-span:all; font-family:var(--font-display); font-weight:700; font-size:12.5pt;
    color:var(--paper-ink); margin: 6mm 0 3mm; padding-bottom:1.6mm;
    border-bottom:1.4pt solid var(--paper-ink);
    break-after:avoid-column; break-inside:avoid-column;
  }
  .part-banner + .l1{ margin-top:0; }

  .h1{ font-size:10.3pt; margin:4mm 0 1.6mm; break-inside:avoid-column; break-after:avoid-column; line-height:1.4; }
  .h1 .bullet{ color:var(--paper-ink); margin-right:1.3mm; font-size:8pt; vertical-align:1pt; }
  .h1 .lead{ font-weight:700; color:var(--paper-ink); font-family:var(--font-display); }
  .h1 .rest{ font-weight:400; color:var(--paper-ink); }

  .h2{ font-size:9.6pt; font-weight:700; color:var(--paper-ink); margin:3mm 0 1.1mm 1mm; break-inside:avoid-column; break-after:avoid-column; }
  .h2 .bullet{ color:var(--paper-ink-soft); margin-right:1.2mm; font-weight:400; }

  .h3{ font-size:9.1pt; font-weight:700; color:var(--paper-ink-soft); margin:2.4mm 0 1mm 2.2mm; break-inside:avoid-column; }
  .h3 .bullet{ margin-right:1.1mm; }

  .text{ font-size:9.3pt; line-height:1.68; margin:0 0 2.1mm; text-align:left; word-break:keep-all; overflow-wrap:break-word; }

  .note{
    font-size:8pt; line-height:1.5; color:var(--paper-ink-soft); font-style:italic;
    margin:1mm 0 1.8mm 1mm; padding-left:2.6mm; border-left:1.4pt solid var(--paper-border);
    word-break:keep-all;
  }
  .note .bullet{ font-style:normal; margin-right:.8mm; color:var(--paper-line); }

  .topic{
    break-inside:avoid-column; margin:2.6mm 0 3mm; padding:3mm 3.6mm;
    background:rgba(198,86,74,.045); border:.75pt solid var(--paper-border);
    border-left:2.4pt solid var(--paper-line);
  }
  /* A long TOPIC box is split into several .topic units (one per
     paragraph) so it can flow across columns/pages — when consecutive
     pieces land as plain DOM siblings (same column), drop the border and
     margin between them so the run still reads as one continuous box;
     a piece that lands in a different column/page keeps its own full
     border, same as any box that legitimately continues elsewhere. */
  .topic + .topic{ margin-top:0; border-top:none; padding-top:0; }
  .topic:has(+ .topic){ margin-bottom:0; border-bottom:none; padding-bottom:0; }
  .topic .chip{
    display:inline-block; font-family:var(--font-body); font-weight:700; font-size:6.6pt;
    letter-spacing:.07em; color:#fff; background:var(--paper-line); border-radius:2.5px;
    padding:1mm 1.8mm; margin-right:1.6mm; vertical-align:1.5px;
  }
  .topic .topic-title{ font-weight:700; font-size:9.3pt; }
  .topic .text{ margin-top:1.6mm; }

  .tbl{ width:100%; border-collapse:collapse; margin:2mm 0 3mm; font-size:8.4pt; line-height:1.4; break-inside:avoid-column; }
  .tbl th, .tbl td{ border:.75pt solid var(--paper-border); padding:1.4mm 2mm; text-align:left; vertical-align:top; }
  .tbl th{ background:var(--paper-band); font-weight:700; font-family:var(--font-display); }

  .figs{ break-inside:avoid-column; margin:2mm 0 3mm; }
  .fig{ margin:0 0 2.6mm; }
  .fig img{ display:block; width:100%; height:auto; border:.75pt solid var(--paper-border); }
  .fig.wide{ column-span:all; }
  .fig.wide img{ max-width:132mm; margin:0 auto; }

  .empty-state{ width:210mm; padding:4rem 2rem; text-align:center; color:var(--ink-faint); font-size:var(--fs-sm); }
  .loading{ padding:5rem 1rem; text-align:center; color:var(--ink-faint); font-size:var(--fs-sm); letter-spacing:.02em; }

  /* ---------------- table-of-contents ---------------- */
  .toc-title{ column-span:all; font-family:var(--font-display); font-weight:900; font-size:19pt; color:var(--paper-ink); margin:0 0 7mm; letter-spacing:.02em; }
  .toc-part{
    break-after:avoid-column; break-inside:avoid-column;
    font-family:var(--font-display); font-weight:800; font-size:13.5pt; color:var(--paper-line);
    border-bottom:1.6pt solid var(--paper-line); padding-bottom:1.8mm; margin:6mm 0 3mm;
  }
  /* .toc-part sits inside a .cols-row's left column now, not directly next
     to .toc-title as a sibling — target it through that wrapper instead. */
  .toc-title + .cols-row .col-left > .toc-part:first-child{ margin-top:0; }
  .toc-l1{
    display:flex; align-items:baseline; gap:1.4mm; break-inside:avoid-column;
    font-family:var(--font-display); font-weight:700; font-size:9.6pt; color:var(--paper-ink);
    margin:2.6mm 0 .9mm;
  }
  .toc-h1{
    display:flex; align-items:baseline; gap:1.4mm; break-inside:avoid-column;
    font-size:8.2pt; color:var(--paper-ink-soft); margin:0 0 .9mm 4mm;
  }
  .toc-label{ flex:0 1 auto; min-width:0; word-break:keep-all; }
  .toc-leader{ flex:1 1 auto; min-width:4mm; border-bottom:1pt dotted var(--paper-border); height:0; align-self:end; margin-bottom:1mm; }
  .toc-pg{ font-variant-numeric:tabular-nums; flex:0 0 auto; }

  /* ---------------- responsive scale-to-fit (viewport only; never re-wraps text) --- */
  @media (max-width: 900px){
    .stage{ padding:1.2rem .6rem 4rem; }
  }

  /* ---------------- print (A4, 좌철/left-bound — .page-inner's own 25mm
     left / 15mm right / 19mm top / 17mm bottom padding IS the binding
     margin, so @page itself stays margin:0 to avoid stacking a second
     margin on top of it) ---------------- */
  @media print{
    .toolbar{ display:none !important; }
    body{ background:#fff; }
    .stage{ background:none; padding:0; gap:0; }
    .page-frame{ break-after:page; }
    .page-frame:last-child{ break-after:auto; }
    .page{ box-shadow:none; }
    @page{ size:A4; margin:0; }
  }
</style>

<div class="toolbar">
  <div class="brand">
    <span class="brand-mark">📘 정치경제 교재</span>
    <span class="brand-sub">TIS 종과 기초반 · 표지연 선생님 — 정치 · 경제</span>
  </div>
  <div class="nav-jump">
    <button class="btn btn-ghost" data-jump="toc" type="button">차례</button>
    <button class="btn btn-ghost" data-jump="part1" type="button">파트1 정치</button>
    <button class="btn btn-ghost" data-jump="part2" type="button">파트2 경제</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="loading" id="loading">교재를 조판하는 중…</div>
</div>

<script id="content-data" type="application/json">/*__CONTENT_JSON__*/</script>
<script id="images-meta-data" type="application/json">/*__IMAGES_META__*/</script>
<script id="images-src-data" type="application/json">/*__IMAGES_DATA__*/</script>

<script>
(function(){
  "use strict";

  // pages known (from DESIGN_SPEC.md) to contain vector-drawn tables that
  // the automatic extraction could not capture as structured rows/columns —
  // their text still renders, just as flowing paragraphs instead of a table.
  var TABLE_PAGES = new Set([3,5,15,18,20,21,22,23,24,26,30,31,33,37,40,44,45,46,47,48,49,50]);

  var CONTENT = JSON.parse(document.getElementById("content-data").textContent).pages;
  var IMAGES_META = JSON.parse(document.getElementById("images-meta-data").textContent);
  var IMAGES_SRC = JSON.parse(document.getElementById("images-src-data").textContent);

  var imagesByPage = {};
  IMAGES_META.forEach(function(im){
    (imagesByPage[im.page] = imagesByPage[im.page] || []).push(im);
  });

  // Manual placement overrides: an image's original PDF page (images.json's
  // "page") is where it happened to sit physically, which isn't always the
  // section it actually illustrates. Each entry moves the named file(s) to
  // render immediately after the L1/H1/NOTE unit whose exact text matches
  // the key, instead of at the end of their filed page — optionally forced
  // to single-column width instead of the usual wide/aspect-ratio guess.
  var IMAGE_AFTER_TEXT = {
    "국가": [{ file: "page01_img1.png" }],
    "법의 분류": [{ file: "page02_img2.png", narrow: true }],
    "역사적 분류": [{ file: "page02_img1.png", narrow: true }],
    "일본의 정치 구조와 권력분립": [{ file: "page14_img1.png", narrow: true }],
    "조약의 승인": [{ file: "page15_img1.png", narrow: true }],
    "내각의 총사직": [{ file: "page17_img3.png", narrow: true }]
  };
  // Anchored to the exact text of a TEXT paragraph rather than a heading —
  // for images that belong right after a specific sentence, not a section
  // title (e.g. the two 중의원 해산 diagrams that illustrate the "…총사직한
  // 사례도 있음." aside rather than the "내각의 총사직" heading itself).
  var IMAGE_AFTER_PARAGRAPH = {
    "내각총리대신이 결원되었을 때 중의원 불신임 결의 후 10일 이내에 해산이 없는 경우 중의원 총선거 후 첫 국회 소집 시 (→ 새 총리 지명 필요) *과거에는 총리의 질병, 중대한 법안 부결, 장관의 부패 사건 등으로 총사직 한 사례도 있음.":
      [{ file: "page17_img1.png", narrow: true }, { file: "page17_img2.png", narrow: true }]
  };
  var overriddenFiles = {};
  Object.keys(IMAGE_AFTER_TEXT).forEach(function(k){
    IMAGE_AFTER_TEXT[k].forEach(function(o){ overriddenFiles[o.file] = true; });
  });
  Object.keys(IMAGE_AFTER_PARAGRAPH).forEach(function(k){
    IMAGE_AFTER_PARAGRAPH[k].forEach(function(o){ overriddenFiles[o.file] = true; });
  });
  var imageByFile = {};
  IMAGES_META.forEach(function(im){ imageByFile[im.file] = im; });

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Builds one <div class="topic"> from a slice of a TOPIC block's
  // paragraphs; `showHeader` puts the TOPIC chip + title at the top (used
  // for the very first piece of a box, never for a spilled continuation).
  function topicHtml(title, paras, showHeader){
    var head = showHeader ? '<span class="chip">TOPIC</span><span class="topic-title">'+esc(title)+'</span>' : '';
    var body = paras.map(function(p){ return '<p class="text">'+esc(p)+'</p>'; }).join('');
    return '<div class="topic">'+head+body+'</div>';
  }

  function flattenItems(pageObj){
    var out = [];
    pageObj.blocks.forEach(function(b){ b.items.forEach(function(it){ out.push(it); }); });
    return out;
  }

  function stripLeadNumber(t){
    return String(t||"").replace(/^\s*\d+\s*/, "");
  }

  // A NOTE line that wrapped in the original PDF got its second (and any
  // further) line tagged as a separate plain TEXT item instead of staying
  // part of the note — the giveaway is that the note doesn't actually end
  // on a sentence boundary. Detecting that and folding the following TEXT
  // item(s) back in keeps a wrapped note in its own box instead of trailing
  // off into an unrelated-looking paragraph right below it.
  var SENT_END_RE = /[。．.!！?？…」』"'）\)\]】]$/;
  function isSentenceComplete(t){
    return SENT_END_RE.test(String(t||"").trim());
  }

  // A run like "…3가지 유형 ① 전통적 지배: … ② 카리스마적 지배: … ③ 합법적
  // 지배: …" was extracted as one wall-to-wall paragraph; splitting before
  // each circled-number marker (①-⑳ — unambiguously an enumeration, never
  // anything else) turns it back into one paragraph per item.
  function splitEnumerated(text){
    return String(text||"").split(/(?=[①-⑳])/).filter(function(s){ return s.length; });
  }
  function formatProseHtml(text){
    return splitEnumerated(text).map(function(seg){ return '<p class="text">'+esc(seg)+'</p>'; }).join("");
  }

  // These six TEXT items each fused a whole numbered step-list (and, in two
  // cases, a run of "*"-marked asides) into one unbroken paragraph, so they
  // read as a wall of text instead of the one-line-per-step layout the rest
  // of the book gets whenever the extraction already separated the steps
  // into their own JSON items. Splitting on the list numbering (and any
  // standalone "*" asides) restores that without touching anything else.
  var SPLIT_LIST_TEXTS = {};
  [
    "1. 대일본제국헌법은 군주가 제정한 ‘흠정헌법’, 일본국헌법은 국민이 제정한 ‘민정헌법’ 2. 주권이 천황에서 국민에게 이전됨 (국민주권) 3. 천황은 통치권 총괄자에서 ‘국가와 국민통합의 상징’으로 변화 4. 군 통수권과 병역 의무 폐지, 평화주의와 전쟁 포기 선언 5. ‘신민’의 자유와 권리는 ‘법률 범위 내’에서 부여되었으나, 일본국헌법에서 는 ‘기본적 인권’으로 광범위하게 보장됨 6. 입법·행정·사법의 삼권분립 확립",
    "정치에 대한 대표적인 관점은 다음의 네 가지이다. 1. 목적론: 인류 사회의 이상 실현을 목표로 하는 활동. 2. 제도론: 국가의 의사를 결정하고 집행하는 통치 기구의 활동 3. 강력론: 힘이 강한 특정 개인이나 집단(계급)이 다른 구성원을 강제적으로 지배하고 복종시키는 현상. 4. 기능론: 인간 사회의 대립을 조정하고, 합의를 이끌어 사회적 가치를 분배 하는 과정.",
    "사회 권력 가운데 대표적인 것. 일반적으로 ‘권력’이라 하면 정치 권력을 가 리키는 경우가 많다. 근대 이후 정치 권력은 국가 권력으로 간주되며, 권력을 행사하는 주체가 국가이다. 1. 강제력은 막강하다. 2. 힘은 전국에 미치며, 조직적이다. 3. 행사는 정당한 것으로 간주된다. 즉, 합법성을 가진다.",
    "근대 의회제도는 다음의 세 가지 원칙을 중심으로 성립되었다: 1. 국민대표의 원칙 / 2. 심의의 원칙 / 3. 행정감독의 원칙 이러한 원칙을 가진 근대 의회는 처음에는 제한 선거제도에 따라 재산을 가 진 시민층(명망가) 이 의원직을 독점했으나, 19세기 후반~20세기 초에 걸쳐 보통선거제가 도입되면서, 민주주의와 결합 된 의회제 민주주의로 발전하게 되었다.",
    "미국 루즈벨트 대통령은 제2차 세계대전 중, 독일・이탈리아・일본 등이 인 권을 유린, 국제적 침략을 감행한 상황을 비판, 1941년 연두교서 ‘4대 자유’ 를 세계 평화 원칙으로 제창했다 1. 언론・표현의 자유 / 2. 신앙의 자유 3. 결핍(빈곤)으로부터의 자유 / 4. 공포로부터의 자유 → 대서양 헌장(1941) 포함,1945년 UN헌장에 인권 존중 명시",
    "현대 국가처럼 영토와 인구가 큰 경우 직접민주제는 비현실적이므로, 일본은 간접민주제(대표민주제)를 채택하고 있다. 1. 보통·평등선거 및 비밀투표 (헌법 제15·43·44조) 2. 국회는 입법을 담당하는 국가 권력의 최고기관 (제41조) 3. 내각이 국회에 대해 책임 지는 의원내각제 (제66~68조)",
    "되었다. 2. 자유권의 확대 : 학문, 사상, 양심의 자유, 고문 및 강제 고백 금지 등 다양 한 자유가 새롭게 포함되었다. 3. 사회권의 도입 : 20세기 헌법의 특징으로, 생존권·교육권·노동권 등 현대 적 권리를 헌법에 포함시켰다. 4. 법 앞의 평등 철저화 : 귀족 제도 폐지, 남녀 불평등 철폐 등을 통해 평등권 을 제도적으로 확립하였다. 5. 위헌심사제도를 통한 권리 보장 실효성 확보 : 인권 보장을 실질화 하기 위 해, 법률이 헌법에 위반되는 경우 무효화할 수 있는 위헌법률심사제도가 마 련되었다.",
    "법무성은 1996년 다음 세 가지 개정안을 제안했고, 이 중 두 가지가 실현되 었다. 1. 혼외자의 상속분을 혼인 중 자녀와 동등하게 함 (2013년 최재에서 혼외자 차별은 위헌이라는 판결 후 개정됨) 최재는 2013년 “혼외자의 상속분을 절반으로 제한한 민법 조항은 평등 원칙 에 반한다”며 기존 합헌 판례(1995년)를 변경하였다. 가족 구조의 다양화가 이유로 제시되었다. 2. 부부별성(성 선택제)을 도입 (미실현, 2015년 최재 현행 규정을 합헌으로 판단) 3. 혼인 연령 남녀 모두 18세로 통일 (2018년 개정으로 실현)",
    "특정 공무원을 임명하는 것이 아니라, 국민의 신뢰를 바탕으로 정치가 운영 된다는 원칙을 뜻한다. 국민이 직접 선거 또는 심사를 통해 임명·해임할 수 있는 것: 1. 국회의원 선거(제43조) 2. 최고재판소 판사 국민심사(제79조) 3. 지방자치단체장 및 지방의회 의원 선거(제93조) 또한 직접민주주의 제도로는 헌법 개정 국민투표, 최고재판소 판사 국민심 사, 지방특별법에 대한 주민투표 등이 있다.",
    "판사의 신분은 원칙적으로 보장되지만, 중대한 직무 위반, 태만, 비행 등이 있는 경우에는 국회가 설치한 탄핵재판소에서 심판을 받아 해임 여부를 결 정할 수 있다. 1. 국회 내 ‘소추위원회’에서 탄핵 여부를 결정 2. 탄핵이 결정되면, 탄핵재판소에서 최종 심리를 거침 3. 탄핵재판소는 중의원 7명, 참의원 7명으로 구성(총 14명)되며, 3분의 2 이 상 찬성으로 판사 해임이 가능하다. 4. 지금까지 총 7명의 판사가 해임된 바 있다.",
    "정족수: 각 의원의 총원 3분의 1 이상 의결 요건: 원칙적으로 출석 의원의 과반수 찬성 특별 다수결 필요 사안: 총원의 3분의 2 이상: 헌법 개정 발의 출석의원 3분의 2 이상: 1. 의원 자격 박탈   2. 비공개 회의 결정 3. 의원 제명        4. 중의원의 법안 재의결",
    "「소년법」은 20세 미만을 소년으로 보지만,  2021년 개정으로 18·19세는 ‘특정소년’으로 분류. 1. 송치 대상 사건 확대 2. 송치 이후 20세 이상과 동일한 취급 3. 실명 보도 가능",
    "영향 1. 상업, 정보산업, 광고·홍보업 등 3차 산업 급격히 성장. 2. 광고비 등은 제품 가격에 포함되는 비용, 가격 상승 요인. 3. 광고의 범람으로 인해 소비자들이 불필요한 제품을 구매하게 되는 등, 사 회적 낭비와 비효율(무의미한 소비의 제도화)가 발생하기 쉽다.",
    "도쿄의 물가는 뉴욕·런던보다 훨씬 높았으며, 생활비가 많이 들었다. 특히 엔 고임에도 불구하고 수입품 가격이 높았다. 1. 복잡한 유통 구조로 인한 비용 상승 2. 브랜드 제품의 고가 설정 3. 수입 제한, 대형 소매점 출점 규제 등의 공공 규제 → 이러한 규제를 완화하자는 요구가 높아졌다.",
    "1. 이농화(離農化) :  다른 산업에서 일하는 것이 소득이 더 높아 농업 인구가 급격히 감소함. 2. 겸업화(兼業化) : 전업 농가(농업만 하는 농가)는 급감하고, 대부분이 겸업 농가가 됨. 3. 여성·고령화 : 남성 노동력 감소로 노인(할아버지· 할머니)과 여성(어머니) 이 중심이 되는 三ちゃん農業 형태가 됨. 4. 농촌의 과소화(過疎化) : 농촌 지역의 인구 유출이 계속됨",

    "1. 국회의 발의: 각 의회의 총의원 3분의 2 이상 찬성 필요 2. 국민투표: 유효투표 과반수 찬성 시 개정 승인 (국민투표법에 따라 만 18 세 이상에게 투표권 부여) 3. 천황의 공포: 국민의 이름으로 헌법과 일체로서 공포됨 (국사행위 중 하나)",
    "1. 일본의 방위력 증강이 의무화되었다. 2. 주일미군의 주둔 목적은 일본의 안전뿐 아니라 극동 지역의 평화와 안전 에 기여하는 것으로 설정되었다. 3. 일본 영토 내 어느 한 쪽이 무력 공격을 받을 경우, 양국은 공동 방위의 의 무를 진다. 4. 주일미군의 배치나 장비의 중요한 변경, 일본 국내 기지에서의 작전행동 에 대해 사전협의를 하기로 되어 있다. *1951년: 샌프란시스코 강화조약과 함께 일미 안보조약이 발효되어 일본은 독립을 회복. *MSA 협정: 미국의 군사·경제 원조를 받는 대가로 일본에도 방위력 증강의 무가 부여됨. *집단적 자위권의 제한적 인정도 관련됨. *자위대와 경찰력은 전력이 아니라는 일본 정부의 주장과 달리, 국제적으로 는 경찰력을 넘는 무력은 모두 전력으로 간주됨. *안보조약 반대 논리 중 하나는, 일본 내 기지를 공격당할 경우 공동방위 조 항에 따라 자위대가 자동 개입될 수 있다는 ‘끌려들기 우려(巻き込まれ論)’",
    "1. 발의: 국회의원뿐만 아니라, 내각, 상임위원회나 특별위원회도 법안을 발 의 2. 심의: 위원회 중심의 심의. 중요 법안은 공청회를 열어 전문가 의견을 청취 3. 의결: 양원 본회의에서 가결되면 법률로 성립. 의견이 다르면 중의원 우월 4. 공포: 내각의 조언과 승인을 거쳐 천황이 공포 *위원회 제도: 소수 의원 구성으로 세부 심의 가능. 상임위원회와 특별위원 회로 구성됨",

  var LIST_SPLIT_RE = /(?=(?:^|\s)(?:[1-9]|1[0-9]|20)\.\s(?!\d))|(?=(?:^|\s)\*(?=\S))/;
  function splitListItems(text){
    return String(text||"").split(LIST_SPLIT_RE).map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
  }

  // H1 "colon rule": bold the lead clause up through a colon only when a
  // substantial explanatory clause follows it; a short title-style H1
  // (no colon, or only a trailing parenthetical) stays bold throughout.
  function renderH1Text(text){
    var idx = -1, colonLen = 1;
    var iHalf = text.indexOf(":"), iFull = text.indexOf("：");
    if(iHalf >= 0 && (iFull < 0 || iHalf < iFull)){ idx = iHalf; }
    else if(iFull >= 0){ idx = iFull; }
    if(idx >= 0 && (text.length - idx - colonLen) > 6){
      var lead = text.slice(0, idx+colonLen);
      var rest = text.slice(idx+colonLen);
      return '<span class="lead">'+esc(lead)+'</span><span class="rest">'+esc(rest)+'</span>';
    }
    return '<span class="lead">'+esc(text)+'</span>';
  }

  function figuresHtml(ims, forceNarrow){
    if(!ims || !ims.length) return "";
    var html = '<div class="figs">';
    ims.forEach(function(im){
      var narrow = im.narrow !== undefined ? im.narrow : forceNarrow;
      var wide = !narrow && (im.w / im.h) > 1.55;
      var src = IMAGES_SRC[im.file];
      if(!src) return;
      // NOT loading="lazy": these are already-embedded base64 data: URIs
      // (no network fetch to defer), and lazy-loading applies to any img
      // regardless of URL scheme — a page frame sitting off in the hidden,
      // off-screen scratch area used for pagination measurement is never
      // "near the viewport", so the image never actually decodes there.
      // The overflow check then measures it at ~0 height, wrongly
      // concludes the page has room, and the image only reveals its real
      // size (and overflows the fixed page box) once it finally loads
      // after being scrolled into view for real.
      html += '<figure class="fig'+(wide?' wide':'')+'"><img src="'+src+'" alt="자료 이미지"></figure>';
    });
    html += '</div>';
    return html;
  }

  // The one wide figure (spanning both columns) needs its unit marked
  // fullWidth so the pagination engine appends it directly to the page
  // instead of into a column — cheaper than threading a second return
  // value through every renderFigs()/renderImageOverride() call site.
  function isWideFigHtml(html){
    return /class="fig wide"/.test(html || "");
  }

  // Every figure in this book renders at single-column width except the
  // 국가/영토 diagram (territorial-waters cross-section) — wide enough,
  // and simple enough at that width, to be the one real exception; every
  // other "wide" image turned out too small to read once shrunk sideways.
  var WIDE_ALLOWED = { "page01_img1.png": true };

  // Returns one html string PER IMAGE (each its own single top-level
  // element, same invariant as any other unit) rather than one batch
  // combining every image on the original page — a page with several
  // images (a couple of graphs plus a data table, say) easily adds up to
  // more than one column's height, and since a unit can never be split
  // across columns/pages, bundling them together forced the whole group
  // to succeed or overflow as one. Separate units let the pagination
  // engine place each image wherever it actually fits.
  function renderFigsList(pageNo){
    var ims = (imagesByPage[pageNo]||[]).filter(function(im){ return !overriddenFiles[im.file]; });
    if(!ims.length) return [];
    ims = ims.slice().sort(function(a,b){
      if(a.column !== b.column) return a.column === "left" ? -1 : 1;
      return a.file < b.file ? -1 : (a.file > b.file ? 1 : 0);
    }).map(function(im){ return Object.assign({}, im, { narrow: !WIDE_ALLOWED[im.file] }); });
    return ims.map(function(im){ return figuresHtml([im]); });
  }

  // Renders any images overridden to anchor right after this exact heading
  // or note text — narrow ones are rendered one at a time (each its own
  // single-column figure) so two of them don't get crammed side by side.
  // Builds ONE combined <div class="figs"> for the whole override group —
  // never several sibling divs — since every unit's html must be exactly
  // one top-level element for the pagination engine's overflow handling.
  function renderOverrideList(overrides){
    if(!overrides) return "";
    var ims = overrides.map(function(o){
      var im = imageByFile[o.file];
      return im ? Object.assign({}, im, { narrow: !!o.narrow }) : null;
    }).filter(Boolean);
    return figuresHtml(ims);
  }
  function renderImageOverride(text){ return renderOverrideList(IMAGE_AFTER_TEXT[text]); }
  function renderImageOverrideForParagraph(text){ return renderOverrideList(IMAGE_AFTER_PARAGRAPH[text]); }

  // ---------------- flatten the whole book into one ordered stream of
  // atomic, page-break-able "units" — original content.json page
  // boundaries are an old-PDF artifact (a part can end and the next one
  // begin on the very same source page) and are deliberately NOT treated
  // as new-page boundaries here; real pagination happens later, driven by
  // how much actually fits in this design's larger, two-column layout. ----
  var tocEntries = []; // [{text,l1s:[{text,h1s:[{text,id,bodyPage}],id,bodyPage}],id,bodyPage}]
  var tocEntryById = {};
  var tocIdSeq = 0;
  var TABLE_HTML_PARTY_COMPARISON = "<table class=\"tbl\"><tr><th>항목</th><th>명망가 정당 (19세기)</th><th>대중 정당 (20세기 이후)</th></tr><tr><td>제도</td><td>제한 선거제</td><td>보통 선거제</td></tr><tr><td>구성</td><td>지역의 ‘재산과 교양’을 갖춘 명망가 중심</td><td>노동자 등 대중이 참여하는 대표정당</td></tr><tr><td>조직</td><td>정당 강령 없음, 살롱형 클럽 중심</td><td>강령과 규약을 갖춘 강한 정당 규율</td></tr><tr><td>활동 방식</td><td>국회의원 중심 활동</td><td>정당 조직을 통한 대중의 일상적 정치 참여</td></tr></table>";

  function buildUnits(){
    var units = [];
    var curPart = null, curL1 = null;
    var curPartEntry = null, curL1Entry = null;

    // Flatten every original page's items into ONE continuous stream first —
    // a sentence can wrap right across an old PDF page boundary (content.json
    // page 1 ends "…홉스, 로크, 루" and page 2 opens "소 등이 주장…", i.e.
    // "루소"), so continuation-merging below has to be able to look past
    // that boundary too, not just within a single original page.
    // A handful of items are stray extraction fragments with no sensible
    // home of their own:
    // - "를 가진다." sits between "…홉스, 로크, 루" and its real continuation
    //   "소 등이 주장…" ("루소"), and its own trailing period was making the
    //   continuation-merge below stop right there instead of reaching the
    //   actual rest of the sentence.
    // - the other two duplicate a sentence that already appears correctly
    //   under "법의 지배 — 미국에서의 발전" ("…입헌주의를 명확히 발전시켰다. 즉,
    //   헌법 제정권자인 국민이 성문 헌법을 통해 국가…"), reappearing a second
    //   time, split in two, right after the Locke summary.
    var SKIP_ITEM_TEXTS = { "를 가진다.": true, "를 명확히 발전시켰다. 즉, 헌법 제정권자인 국민이 성문 헌법을": true, "를 통해 국가": true , "안전할 권리 2. 알 권리 3. 선택할 권리 4. 의견을 반영할 권리": true };

    // A few items were tagged at the wrong level by the extraction: "세계
    // 각국의 정치 체제" is the real section heading but came through as a
    // plain paragraph, while the five country-by-country subsections under
    // it were tagged as if they were top-level L1s (같은 "1 …" 번호 패턴 때문에)
    // instead of the ●-bulleted H1s they actually are.
    var RECLASSIFY = {
      "대표적인 공해 : 1.대기 오염 / 2.수질 오염 / 3.토양 오염 / 4.소음 / 5.진동 /": { text: "대표적인 공해" },
      "6.지반 침하 / 7.악취": { text: "1. 대기 오염 2. 수질 오염 3. 토양 오염 4. 소음 5. 진동 6. 지반 침하 7. 악취." },
      "세계 각국의 정치 체제": { marker: "L1" },
      "1 의원내각제와 대통령제": { marker: "H1", symbol: "●", text: "의원내각제와 대통령제" },
      "2 영국의 정치 체제": { marker: "H1", symbol: "●", text: "영국의 정치 체제" },
      "3 미국의 정치 체제": { marker: "H1", symbol: "●", text: "미국의 정치 체제" },
      "4 프랑스·러시아·중국의 정치 체제": { marker: "H1", symbol: "●", text: "프랑스·러시아·중국의 정치 체제" },
      "5 개발독재와 이슬람 국가의 정치 체제": { marker: "H1", symbol: "●", text: "개발독재와 이슬람 국가의 정치 체제" },
      "조약의 승인 (条約の承認)": { text: "조약의 승인" }
    };

    // Same underlying problem, different shape: here the heading text wasn't
    // even split into its own item — it's the opening words of a TEXT
    // paragraph ("2. 권력분립과 간접민주제 민주정치의 목적은…"). Splitting off
    // the matched prefix as its own heading and leaving the rest as the
    // paragraph that follows it fixes that without touching anything else
    // in the item.
    // Several of these embed more than one heading in a row before the
    // real paragraph starts (e.g. "국회의 지위와 권한 1. 일본의 정치 구조와
    // 권력분립 헌법상 규정 …" is an L1 title immediately followed by its
    // first H1, both swallowed into the same TEXT item) — so matching runs
    // in a loop, peeling off one heading at a time, until nothing more
    // matches and whatever text remains becomes the paragraph.
    var EMBEDDED_HEADINGS = [
      { prefix: "2. 권력분립과 간접민주제 ", heading: "권력분립과 간접민주제", marker: "H1", symbol: "■" },
      { prefix: "국회의 지위와 권한 ", heading: "국회의 지위와 권한", marker: "L1" },
      { prefix: "1. 일본의 정치 구조와 권력분립 ", heading: "일본의 정치 구조와 권력분립", marker: "H1", symbol: "■" },
      { prefix: "2. 입법부(국회)와 행정부(내각)의 관계 ", heading: "입법부(국회)와 행정부(내각)의 관계", marker: "H1", symbol: "■" },
      { prefix: "3. 사법부와 입법·행정부의 관계 ", heading: "사법부와 입법·행정부의 관계", marker: "H1", symbol: "■" },
      { prefix: "일본의 지방분권 ", heading: "일본의 지방분권", marker: "H1", symbol: "■" },
      { prefix: "② 국회의 지위 ", heading: "국회의 지위", marker: "H1", symbol: "■" },
      { prefix: "■ 의회란 무엇인가 ", heading: "의회란 무엇인가", marker: "H1", symbol: "■" },
      { prefix: "사법과 재판소 ", heading: "사법과 재판소", marker: "L1" },
      { prefix: "재판소의 지위", heading: "재판소의 지위", marker: "H1", symbol: "●" },
      { prefix: "정당과 선거 ", heading: "정당과 선거", marker: "L1" },
      { prefix: "1. 의회 정치와 정당 ", heading: "의회 정치와 정당", marker: "H1", symbol: "■" },
      { prefix: "③ 금융의 구조 ", heading: "금융의 구조", marker: "H1", symbol: "③" },
      { prefix: "● 금융의 역할 ", heading: "금융의 역할", marker: "H1", symbol: "●" },
      { prefix: "④ 금융기관과 그 기능 ", heading: "금융기관과 그 기능", marker: "H1", symbol: "④" },
      { prefix: "● 은행의 업무 ", heading: "은행의 업무", marker: "H1", symbol: "●" },
      { prefix: "경제사회의 변화와 현대 경제의 구조 ", heading: "경제사회의 변화와 현대 경제의 구조", marker: "L1" },
      { prefix: "1. 재정의 구조와 역할 ■ ", heading: "재정의 구조와 역할", marker: "H1", symbol: "■" },
      { prefix: "3. 조세의 구조 ", heading: "조세의 구조", marker: "H1", symbol: "■" },
      { prefix: "○ 세입의 중심은 조세 ", heading: "세입의 중심은 조세", marker: "H2", symbol: "○" },
      { prefix: "국채 의존도의 증가 ", heading: "국채 의존도의 증가", marker: "H1", symbol: "■" },
      { prefix: "○ 국채 발행 추이 ", heading: "국채 발행 추이", marker: "H2", symbol: "○" },
      { prefix: "노동시간과 휴일 - ", heading: "노동시간과 휴일", marker: "H1", symbol: "■" },
      { prefix: "〇 노동시간 ", heading: "노동시간", marker: "H2", symbol: "〇" },
      { prefix: "노동조합 - ", heading: "노동조합", marker: "H1", symbol: "■" },
      { prefix: "〇 조합 활동의 법적 보장 ", heading: "조합 활동의 법적 보장", marker: "H2", symbol: "〇" },
      { prefix: "사회 보장과 복지 - ", heading: "사회 보장과 복지", marker: "H1", symbol: "■" },
      { prefix: "1. 실업보험의 도입 ", heading: "실업보험의 도입", marker: "H2", symbol: "○" },
      { prefix: "2. 사회보장의 권리화 - ", heading: "사회보장의 권리화", marker: "H2", symbol: "○" },
      { prefix: "○ 개인의 책임에서 사회적 문제로 ", heading: "개인의 책임에서 사회적 문제로", marker: "H3", symbol: "○" }
    ];

    // The original PDF drew this comparison as a vector table (no text
    // extraction captures its grid), so its cell text came through as 6
    // separate, oddly-split TEXT fragments in reading order. Matching that
    // exact run and replacing it with a real <table> is a one-off fix, not
    // a general table-detection mechanism.
    var TABLE_SEQUENCES = [
      {
        matchTexts: [
          "항목 명망가 정당 (19세기) 대중 정당 (20세기 이후) 제도 제한 선거제 보통 선거제 구성 지역의 ‘재산과 교양’을 갖 춘 명망가 중심",
          "노동자 등 대중이 참여하는 대표",
          "정당 조직정당 강령 없음, 살롱형 클",
          "럽 중심",
          "강령과 규약을 갖춘 강한 정당 규율",
          "활동 방식국회의원 중심 활동 정당 조직을 통한 대중의 일상적 정치 참여"
        ],
        html: TABLE_HTML_PARTY_COMPARISON
      }
    ];

    var items = [];
    CONTENT.forEach(function(pageObj){
      var pageItems = flattenItems(pageObj);
      for(var pi=0; pi<pageItems.length; pi++){
        var it = pageItems[pi];

        var seq = TABLE_SEQUENCES.find(function(s){
          return s.matchTexts.every(function(t, k){ return pageItems[pi+k] && pageItems[pi+k].text === t; });
        });
        if(seq){
          items.push({ it: { marker: "TABLE", symbol: null, text: "", html: seq.html }, page: pageObj.page });
          pi += seq.matchTexts.length - 1;
          continue;
        }

        if(SKIP_ITEM_TEXTS[it.text]) continue;
        var patch = RECLASSIFY[it.text];
        if(patch) it = Object.assign({}, it, patch);

        var rest = it.text;
        var extracted = [];
        var match;
        while((match = EMBEDDED_HEADINGS.find(function(e){ return rest.indexOf(e.prefix) === 0; }))){
          extracted.push({ marker: match.marker, symbol: match.symbol, text: match.heading });
          rest = rest.slice(match.prefix.length);
        }
        if(extracted.length){
          extracted.forEach(function(h){ items.push({ it: { marker: h.marker, symbol: h.symbol, text: h.text }, page: pageObj.page }); });
          if(rest) items.push({ it: { marker: "TEXT", symbol: null, text: rest }, page: pageObj.page });
          continue;
        }
        items.push({ it: it, page: pageObj.page });
      }
    });

    var lastPage = null;
    function flushPageFigs(){
      if(lastPage === null) return;
      renderFigsList(lastPage).forEach(function(figHtml){
        units.push({ html: figHtml, state:{part:curPart,l1:curL1}, fullWidth: isWideFigHtml(figHtml) });
      });
    }

    for(var i=0;i<items.length;i++){
      var it = items[i].it;
      if(items[i].page !== lastPage){ flushPageFigs(); lastPage = items[i].page; }

      if(it.marker === "TABLE"){
        units.push({ html: it.html, state:{part:curPart,l1:curL1} });
      } else if(it.marker === "PART"){
        curPart = it.text;
        curL1 = null; // a new part has no "current L1" yet — don't carry the old part's over
        curL1Entry = null;
        var pid = "t"+(tocIdSeq++);
        curPartEntry = { text: it.text, l1s: [], id: pid };
        tocEntryById[pid] = curPartEntry;
        tocEntries.push(curPartEntry);
        units.push({ html: '<div class="part-banner" data-toc-id="'+pid+'">'+esc(it.text)+'</div>', state:{part:curPart,l1:curL1}, forceBreak:true, fullWidth:true });
      } else if(it.marker === "L1"){
        curL1 = stripLeadNumber(it.text);
        if(!curPartEntry){ curPartEntry = { text:"", l1s:[] }; tocEntries.push(curPartEntry); }
        var lid = "t"+(tocIdSeq++);
        curL1Entry = { text: curL1, h1s: [], id: lid };
        tocEntryById[lid] = curL1Entry;
        curPartEntry.l1s.push(curL1Entry);
        units.push({ html: '<h2 class="l1" data-toc-id="'+lid+'">'+esc(curL1)+'</h2>', state:{part:curPart,l1:curL1}, isHeading:true, fullWidth:true });
        var overrideFigHtml1 = renderImageOverride(curL1);
        if(overrideFigHtml1) units.push({ html: overrideFigHtml1, state:{part:curPart,l1:curL1}, fullWidth: isWideFigHtml(overrideFigHtml1) });
      } else if(it.marker === "H1"){
        var hid = "t"+(tocIdSeq++);
        var h1TocText = it.text.replace(/\s*[:：].*$/,"");
        var h1Entry = { text: h1TocText, id: hid };
        tocEntryById[hid] = h1Entry;
        if(curL1Entry) curL1Entry.h1s.push(h1Entry); // an H1 before any L1 never happens in practice, but if
        // it did, h1Entry would simply have no TOC row — its body text still renders either way.
        units.push({
          html: '<h3 class="h1" data-toc-id="'+hid+'"><span class="bullet">'+esc(it.symbol||"")+'</span>'+renderH1Text(it.text)+'</h3>',
          state:{part:curPart,l1:curL1}, isHeading:true
        });
        var overrideFigHtml2 = renderImageOverride(it.text) || renderImageOverride(h1TocText);
        if(overrideFigHtml2) units.push({ html: overrideFigHtml2, state:{part:curPart,l1:curL1}, fullWidth: isWideFigHtml(overrideFigHtml2) });
      } else if(it.marker === "H2"){
        units.push({ html: '<h4 class="h2"><span class="bullet">'+esc(it.symbol||"○")+'</span>'+esc(it.text)+'</h4>', state:{part:curPart,l1:curL1}, isHeading:true });
      } else if(it.marker === "H3"){
        units.push({ html: '<h5 class="h3"><span class="bullet">'+esc(it.symbol||"◎")+'</span>'+esc(it.text)+'</h5>', state:{part:curPart,l1:curL1}, isHeading:true });
      } else if(it.marker === "NOTE"){
        var noteText = it.text;
        var k = i+1;
        while(!isSentenceComplete(noteText) && k < items.length && items[k].it.marker === "TEXT"){
          noteText += " " + items[k].it.text; // the line wrap almost always fell at a word boundary; occasionally
          // (a single trailing syllable of one word) this leaves a stray space rather than a joined word —
          // a milder defect than running two words together with none at all.
          k++;
        }
        // A short ※ line is a genuine marginal annotation and keeps the note
        // styling; once merging has stretched it past a couple of sentences
        // it reads as real body content, not an aside, so it renders as
        // plain paragraphs (no bullet, no italic, no border) instead.
        if(noteText.length > 100){
          splitEnumerated(noteText).forEach(function(seg){
            units.push({ html: '<p class="text">'+esc(seg)+'</p>', state:{part:curPart,l1:curL1} });
          });
        } else {
          units.push({ html: '<p class="note"><span class="bullet">'+esc(it.symbol||"※")+'</span>'+esc(noteText)+'</p>', state:{part:curPart,l1:curL1} });
        }
        var overrideFigHtml3 = renderImageOverride(it.text);
        if(overrideFigHtml3) units.push({ html: overrideFigHtml3, state:{part:curPart,l1:curL1}, fullWidth: isWideFigHtml(overrideFigHtml3) });
        i = k-1;
      } else if(it.marker === "TOPIC"){
        // A long TOPIC box (title + several paragraphs) rendering as one
        // indivisible unit meant that if it didn't fit whatever column
        // space was left, the WHOLE box moved elsewhere, stranding blank
        // space behind it. But splitting it into one unit PER PARAGRAPH
        // up front (an earlier attempt) over-corrected: a box that fits
        // in two columns' worth of space would still fragment into as
        // many tiny boxes as it has paragraphs, each visually its own
        // box. What's wanted is splitting only where a column break
        // actually falls — at most once per column/page it spans — so
        // this carries the whole paragraph list as data (topicParas) for
        // placeSplittableTopic() to greedily pack as much as fits into
        // each column before spilling the remainder into the next.
        var title = it.text.replace(/^\s*TOPIC\s*[:：]\s*/, "");
        var bodyParas = [];
        var j = i+1;
        while(j < items.length && items[j].it.marker === "TEXT"){
          bodyParas = bodyParas.concat(splitEnumerated(items[j].it.text));
          j++;
        }
        units.push({
          html: topicHtml(title, bodyParas, true), // used by the heading-orphan-avoidance dry run (fitsGroup), which treats every unit as one atomic block — real placement always goes through placeSplittableTopic instead, via topicParas below
          topicTitle: title, topicParas: bodyParas, state:{part:curPart,l1:curL1}
        });
        i = j-1;
      } else { // TEXT — absorb any further TEXT items needed to reach a real
        // sentence end, since a paragraph can be left hanging either by a
        // mid-sentence line wrap or by a stray unrelated fragment sitting
        // between it and its true continuation (both occur in this data).
        // Original pages 43-51 are the ones DESIGN_SPEC.md documents as
        // having sparser subheading extraction — many short bullet-style
        // TEXT items there never end on a sentence boundary, so this merge
        // can otherwise chain dozens of them (spanning genuinely unrelated
        // topics) into one 1000+ character block too tall to fit in a
        // single column. Capping the merge length there only (pages 1-42
        // already render correctly and shouldn't change) trades an
        // occasional mid-sentence paragraph break for never producing an
        // unbreakable block that overflows the page.
        var textAcc = it.text;
        var m = i+1;
        var textMergeCap = items[i].page >= 43 ? 500 : Infinity;
        while(!isSentenceComplete(textAcc) && textAcc.length < textMergeCap && m < items.length && items[m].it.marker === "TEXT"){
          textAcc += " " + items[m].it.text;
          m++;
        }
        if(SPLIT_LIST_TEXTS[textAcc]){
          splitListItems(textAcc).forEach(function(seg){
            if(seg.charAt(0) === "*"){
              units.push({ html: '<p class="note"><span class="bullet">*</span>'+esc(seg.slice(1).trim())+'</p>', state:{part:curPart,l1:curL1} });
            } else {
              units.push({ html: '<p class="text">'+esc(seg)+'</p>', state:{part:curPart,l1:curL1} });
            }
          });
        } else {
          splitEnumerated(textAcc).forEach(function(seg){
            units.push({ html: '<p class="text">'+esc(seg)+'</p>', state:{part:curPart,l1:curL1} });
          });
        }
        var overrideFigHtml4 = renderImageOverrideForParagraph(textAcc);
        if(overrideFigHtml4) units.push({ html: overrideFigHtml4, state:{part:curPart,l1:curL1}, fullWidth: isWideFigHtml(overrideFigHtml4) });
        i = m-1;
      }
    }
    flushPageFigs();
    return units;
  }

  // ---------------- pagination engine ----------------
  // Pages are built into an off-screen (visibility:hidden, still laid out
  // and measurable) scratch area first — units are appended one at a time
  // and, the moment a page's two-column content actually overflows its
  // fixed printable area, the last unit is moved to a fresh page instead.
  // This guarantees no content is ever silently clipped or shrunk away,
  // unlike scaling a fixed 1-source-page-per-output-page layout to fit.
  var scratch = document.createElement("div");
  scratch.style.cssText = "position:absolute; visibility:hidden; top:0; left:0; pointer-events:none;";
  document.body.appendChild(scratch);

  function buildPageShell(){
    var frame = document.createElement("div");
    frame.className = "page-frame";
    var page = document.createElement("div");
    page.className = "page";
    frame.appendChild(page);
    return { frame: frame, page: page };
  }

  function makeBodyPage(state){
    var shell = buildPageShell();
    var inner = document.createElement("div");
    inner.className = "page-inner";
    var pagenoEl = document.createElement("span");
    pagenoEl.className = "pageno";
    var crumbEl = document.createElement("span");
    crumbEl.className = "crumb";
    crumbEl.innerHTML = esc(state.part||"") + (state.l1 ? '<span class="sep">·</span>'+esc(state.l1) : "");
    var kicker = document.createElement("div");
    kicker.className = "page-kicker";
    kicker.appendChild(crumbEl);
    kicker.appendChild(pagenoEl);
    var contentWrap = document.createElement("div");
    contentWrap.className = "page-content";
    var contentInner = document.createElement("div");
    contentInner.className = "page-content-inner";
    contentWrap.appendChild(contentInner);
    var footer = document.createElement("div");
    footer.className = "page-footer";
    footer.innerHTML = '<span>표지연 선생님 · TIS 종과 기초반</span><span>'+esc(state.part||"")+'</span>';
    inner.appendChild(kicker); inner.appendChild(contentWrap); inner.appendChild(footer);
    shell.page.appendChild(inner);
    scratch.appendChild(shell.frame);
    return { frame: shell.frame, contentWrap: contentWrap, contentInner: contentInner, pagenoEl: pagenoEl, activeRow: null };
  }

  function makeTocPage(index){
    var shell = buildPageShell();
    var inner = document.createElement("div");
    inner.className = "page-inner";
    var pagenoEl = document.createElement("span");
    pagenoEl.className = "pageno";
    pagenoEl.textContent = String(index+1);
    var kicker = document.createElement("div");
    kicker.className = "page-kicker";
    kicker.innerHTML = '<span class="crumb">차례</span>';
    kicker.appendChild(pagenoEl);
    var contentWrap = document.createElement("div");
    contentWrap.className = "page-content";
    var contentInner = document.createElement("div");
    contentInner.className = "page-content-inner";
    if(index === 0){ contentInner.innerHTML = '<h1 class="toc-title">차례 · Contents</h1>'; }
    contentWrap.appendChild(contentInner);
    var footer = document.createElement("div");
    footer.className = "page-footer";
    footer.innerHTML = '<span>표지연 선생님 · TIS 종과 기초반</span><span>차례</span>';
    inner.appendChild(kicker); inner.appendChild(contentWrap); inner.appendChild(footer);
    shell.page.appendChild(inner);
    shell.frame.dataset.toc = "1";
    scratch.appendChild(shell.frame);
    return { frame: shell.frame, contentWrap: contentWrap, contentInner: contentInner, activeRow: null };
  }

  function overflowed(rec){
    return rec.contentInner.getBoundingClientRect().height > rec.contentWrap.getBoundingClientRect().height + 0.5;
  }

  // Parses `html` (always exactly one top-level element, per the "one unit
  // = one top-level element" invariant the rest of this file relies on)
  // into a real DOM node.
  function htmlToElement(html){
    var tmpl = document.createElement("template");
    tmpl.innerHTML = html.trim();
    return tmpl.content.firstElementChild;
  }

  // Creates a new left/right column row, appends it to `contentInner`, and
  // returns a handle tracking which of its two columns content is
  // currently being appended to.
  function createRow(contentInner){
    var row = document.createElement("div");
    row.className = "cols-row";
    var colLeft = document.createElement("div");
    colLeft.className = "col col-left";
    var colRight = document.createElement("div");
    colRight.className = "col col-right";
    row.appendChild(colLeft);
    row.appendChild(colRight);
    contentInner.appendChild(row);
    return { row: row, colLeft: colLeft, colRight: colRight, activeCol: colLeft };
  }

  // A row whose left column ends up noticeably fuller than its right one
  // reads exactly as intended UP TO that point — column 1 read before
  // column 2, as any 2-column layout should. The imbalance itself is
  // often fine (colRight just hadn't been reached yet when a page ended
  // for an unrelated reason), but the moment a full-width heading needs
  // to close the row out, the gap becomes wasted space for the rest of
  // the page — and it also means less room was left to test the heading
  // (plus its own first content unit) against, when a chunk of colRight's
  // now-usable height was sitting unused in colLeft. Moving enough of
  // colLeft's back items into colRight to bring the two within one item
  // of each other — still in reading order, left column read in full
  // before right — fixes both: the wasted space, and gives the heading a
  // fairer shot at fitting on this page instead of stranding on its own
  // at the top of a fresh one. insertBefore with colRight's original
  // first child as the reference (null when colRight started empty, so
  // this degrades to a plain append) keeps the moved items ahead of
  // whatever colRight already had, matching reading order.
  // Returns the moved nodes (or null if the row was already close enough
  // to balanced to leave alone), so a caller that finds the rebalance
  // didn't actually help can undo it with undoRebalance() below instead
  // of leaving a permanent side effect from a failed attempt.
  function rebalanceRow(row){
    if(!row) return null;
    var left = row.colLeft.children.length, right = row.colRight.children.length;
    if(left - right < 2) return null;
    var leftChildren = Array.from(row.colLeft.children);
    var moveCount = Math.floor((left - right) / 2);
    var moved = leftChildren.slice(leftChildren.length - moveCount);
    var refNode = row.colRight.firstChild;
    moved.forEach(function(node){ row.colRight.insertBefore(node, refNode); });
    return moved;
  }

  function undoRebalance(row, moved){
    if(!moved) return;
    moved.forEach(function(node){ row.colLeft.appendChild(node); });
  }

  // Appends one unit's element into the page, following the same
  // left-column-then-right-column order a reader's eye follows: `unit.
  // fullWidth` (a part banner, an L1, or the one wide figure) closes off
  // whatever row is open — rebalancing it first if needed — and is
  // appended directly to contentInner; anything else goes into the open
  // row's active column, opening a fresh row first if none is open.
  // Returns the DOM node it appended, for the caller to remove again if
  // it doesn't fit.
  function appendUnit(cur, unit){
    var el = htmlToElement(unit.html);
    if(unit.fullWidth){
      rebalanceRow(cur.activeRow);
      cur.activeRow = null;
      cur.contentInner.appendChild(el);
    } else {
      if(!cur.activeRow) cur.activeRow = createRow(cur.contentInner);
      cur.activeRow.activeCol.appendChild(el);
    }
    return el;
  }

  // Appends `unit.html` to the current page; if that overflows the page,
  // the element is removed and re-tried: a non-full-width unit that
  // overflows while the active column is the left one and the right
  // column is still untouched gets one retry there before giving up, and
  // anything that still doesn't fit moves to a freshly created page
  // instead — where, as the very first thing placed there, it's always
  // accepted even if it alone exceeds one page (nothing better to do with
  // a single oversized unit).
  function placeUnit(pages, cur, unit, pageFactory){
    if(unit.forceBreak && cur.contentInner.children.length > 0){
      cur = pageFactory();
      pages.push(cur);
    }
    var pageWasEmpty = cur.contentInner.children.length === 0;

    if(unit.fullWidth){
      rebalanceRow(cur.activeRow);
      var elFull = htmlToElement(unit.html);
      cur.activeRow = null;
      cur.contentInner.appendChild(elFull);
      if(!pageWasEmpty && overflowed(cur)){
        cur.contentInner.removeChild(elFull);
        cur = pageFactory();
        pages.push(cur);
        cur.activeRow = null;
        elFull = htmlToElement(unit.html);
        cur.contentInner.appendChild(elFull);
      }
      cur.lastPlacedEl = elFull;
      return cur;
    }

    if(!cur.activeRow) cur.activeRow = createRow(cur.contentInner);
    var row = cur.activeRow;
    var col = row.activeCol;
    var el = htmlToElement(unit.html);
    col.appendChild(el);
    if(pageWasEmpty || !overflowed(cur)){ cur.lastPlacedEl = el; return cur; }

    col.removeChild(el);
    if(col === row.colLeft && row.colRight.children.length === 0){
      row.activeCol = row.colRight;
      var el2 = htmlToElement(unit.html);
      row.colRight.appendChild(el2);
      if(!overflowed(cur)){ cur.lastPlacedEl = el2; return cur; }
      row.colRight.removeChild(el2);
    }

    cur = pageFactory();
    pages.push(cur);
    cur.activeRow = createRow(cur.contentInner);
    var el3 = htmlToElement(unit.html);
    cur.activeRow.activeCol.appendChild(el3);
    cur.lastPlacedEl = el3;
    return cur;
  }

  // A TOPIC box (unit.topicParas) is the one kind of unit allowed to
  // split — but only at an actual column boundary, at most once per
  // column/page it spans, never once per internal paragraph. Tries the
  // whole remaining paragraph list as a single unit first, reusing
  // placeUnit's normal fallback order (current column, a still-empty
  // right column, then a fresh page); that only leaves it overflowing if
  // it was accepted purely because it was the sole content of an empty
  // column (placeUnit's safety valve for one oversized unit) — in that
  // case, pack the largest leading slice of paragraphs that actually
  // fits there instead, and hand back the rest as a continuation (no
  // chip/title) for the caller to insert right after this unit in the
  // stream, where it goes through this exact same process again.
  function placeSplittableTopic(pages, cur, unit, pageFactory){
    var showHeader = !!unit.topicTitle; // continuations (spilled remainders) carry no title and never show the chip again
    var wholeUnit = { html: topicHtml(unit.topicTitle, unit.topicParas, showHeader) };
    var afterCur = placeUnit(pages, cur, wholeUnit, pageFactory);
    if(!overflowed(afterCur)) return { cur: afterCur, continuation: null };

    afterCur.lastPlacedEl.parentNode.removeChild(afterCur.lastPlacedEl);
    var col = afterCur.activeRow.activeCol;

    var n = unit.topicParas.length;
    var fitCount = 1;
    for(var k = n-1; k >= 1; k--){
      var testEl = htmlToElement(topicHtml(unit.topicTitle, unit.topicParas.slice(0, k), showHeader));
      col.appendChild(testEl);
      var ok = !overflowed(afterCur);
      col.removeChild(testEl);
      if(ok){ fitCount = k; break; }
    }

    var placedEl = htmlToElement(topicHtml(unit.topicTitle, unit.topicParas.slice(0, fitCount), showHeader));
    col.appendChild(placedEl);
    afterCur.lastPlacedEl = placedEl;

    var remaining = unit.topicParas.slice(fitCount);
    var continuation = remaining.length
      ? { html: topicHtml(null, remaining, false), topicTitle: null, topicParas: remaining, state: unit.state }
      : null;
    return { cur: afterCur, continuation: continuation };
  }

  // A heading (`isHeading`) that fits on the current page but leaves no
  // room for what comes right after it would otherwise sit orphaned at the
  // very bottom, with its own content starting fresh on the next page —
  // and a run of several headings in a row (L1 then immediately H1) needs
  // the SAME guard applied to the whole run at once, or the later heading
  // can still separate from the first even though each individually passed
  // a plain one-ahead check. Test the whole run plus one real content unit
  // together (using the page's current column position, same as a real
  // placement would) before committing any of it, and push the entire
  // group onto a new page if that combination doesn't fit.
  function fitsGroup(cur, unitList){
    var savedRow = cur.activeRow;
    var savedCol = savedRow ? savedRow.activeCol : null;
    var rowsBefore = Array.from(cur.contentInner.children).filter(function(c){ return c.classList.contains("cols-row"); });
    var added = unitList.map(function(u){ return appendUnit(cur, u); });
    var fits = !overflowed(cur);
    for(var k=added.length-1;k>=0;k--) added[k].parentNode.removeChild(added[k]);
    // A group starting with a fullWidth unit (an L1) makes appendUnit open
    // a fresh row for whatever non-fullWidth unit follows it — undoing the
    // leaf elements above can leave that fresh row behind, empty. Since it
    // didn't exist before this dry run, remove it too.
    Array.from(cur.contentInner.children).forEach(function(rowEl){
      if(rowEl.classList.contains("cols-row") && rowsBefore.indexOf(rowEl) === -1 &&
         rowEl.querySelector(".col-left").children.length === 0 && rowEl.querySelector(".col-right").children.length === 0){
        rowEl.parentNode.removeChild(rowEl);
      }
    });
    cur.activeRow = savedRow;
    if(savedRow) savedRow.activeCol = savedCol;
    return fits;
  }

  function paginateBody(units){
    var pages = [];
    var cur = makeBodyPage(units.length ? units[0].state : {});
    pages.push(cur);
    for(var idx=0; idx<units.length; idx++){
      var u = units[idx];
      if(u.isHeading && cur.contentInner.children.length > 0){
        var j = idx;
        while(j+1 < units.length && units[j+1].isHeading) j++;
        var end = Math.min(j+1, units.length-1); // one real content unit past the heading run, if any
        if(end > idx && !units[end].forceBreak){
          var groupUnits = [];
          for(var g=idx; g<=end; g++) groupUnits.push(units[g]);
          if(!fitsGroup(cur, groupUnits)){
            // Doesn't fit at the current column position. If this run
            // starts with a full-width heading (an L1), fitsGroup's dry
            // run above already rebalanced the row it would close out (see
            // rebalanceRow()) — that's a one-way improvement, so there's
            // nothing more to try there. Otherwise, if the right column of
            // the same row is still empty (we were about to place this run
            // at the top of a fresh left column, not partway down one),
            // try it there before giving up and starting a whole new page.
            var row = cur.activeRow;
            var canTryRight = row && row.activeCol === row.colLeft && row.colRight.children.length === 0;
            var fitsRight = false;
            if(canTryRight){
              row.activeCol = row.colRight;
              fitsRight = fitsGroup(cur, groupUnits);
              if(!fitsRight) row.activeCol = row.colLeft;
            }
            // A run NOT led by a full-width unit (a plain H2/H3 chain, say)
            // never goes through appendUnit's own fullWidth-triggered
            // rebalance, so a row where colLeft ended up well ahead of
            // colRight, leaving this run stuck without room, never gets
            // the chance to redistribute on its own. Rebalancing moves
            // colLeft's later items into colRight, which means colRight
            // now holds the chronologically LATEST placed content — so
            // the next thing appended (this run, if it now fits) has to
            // go after that, in colRight, not colLeft, however activeCol
            // was left pointing after the (reverted) attempt above.
            var fitsAfterRebalance = false;
            if(!fitsRight && row){
              var priorActiveCol = row.activeCol;
              var moved = rebalanceRow(row);
              row.activeCol = row.colRight;
              fitsAfterRebalance = fitsGroup(cur, groupUnits);
              if(!fitsAfterRebalance){
                // Didn't help — undo it rather than leaving a permanent
                // reshuffle behind for a run that's moving to a new page
                // anyway; repeated failed attempts across this row's
                // lifetime would otherwise compound into moving far more
                // than intended.
                undoRebalance(row, moved);
                row.activeCol = priorActiveCol;
              }
            }
            if(!fitsRight && !fitsAfterRebalance){
              cur = makeBodyPage(u.state);
              pages.push(cur);
            }
          }
        }
      }
      if(u.topicParas){
        var topicResult = placeSplittableTopic(pages, cur, u, function(){ return makeBodyPage(u.state); });
        cur = topicResult.cur;
        if(topicResult.continuation) units.splice(idx+1, 0, topicResult.continuation);
      } else {
        cur = placeUnit(pages, cur, u, function(){ return makeBodyPage(u.state); });
      }
    }
    return pages;
  }

  function buildTocUnits(){
    var units = [];
    tocEntries.forEach(function(part){
      units.push({ html: '<div class="toc-part">'+esc(part.text)+'</div>', forceBreak:false, entryRef: part });
      part.l1s.forEach(function(l1){
        units.push({
          html: '<div class="toc-l1"><span class="toc-label">'+esc(l1.text)+'</span><span class="toc-leader"></span><span class="toc-pg">'+
            (l1.bodyPage||"")+'</span></div>',
          entryRef: l1
        });
        l1.h1s.forEach(function(h1){
          if(!h1) return;
          units.push({
            html: '<div class="toc-h1"><span class="toc-label">'+esc(h1.text)+'</span><span class="toc-leader"></span><span class="toc-pg">'+
              (h1.bodyPage||"")+'</span></div>',
            entryRef: h1
          });
        });
      });
    });
    return units;
  }

  function paginateToc(units){
    var pages = [];
    var cur = makeTocPage(0);
    pages.push(cur);
    units.forEach(function(u){
      cur = placeUnit(pages, cur, u, function(){ return makeTocPage(pages.length); });
      if(u.entryRef) u.entryRef.tocPgEl = cur.lastPlacedEl.querySelector(".toc-pg");
    });
    return pages;
  }

  // ---------------- assembly ----------------
  var stage = document.getElementById("stage");

  function build(){
    scratch.innerHTML = "";
    tocEntries = [];
    tocEntryById = {};
    tocIdSeq = 0;

    var units = buildUnits();
    var bodyPages = paginateBody(units);

    // each heading unit carries a data-toc-id stamped at build time; once
    // pagination has settled where it actually landed, look it straight up —
    // robust regardless of how any single heading's placement moved around.
    bodyPages.forEach(function(rec, pIdx){
      rec.contentInner.querySelectorAll("[data-toc-id]").forEach(function(node){
        var entry = tocEntryById[node.getAttribute("data-toc-id")];
        if(entry) entry.bodyPage = pIdx;
      });
    });

    var tocUnits = buildTocUnits();
    var tocPages = paginateToc(tocUnits);
    var tocCount = tocPages.length;

    // patch final page numbers now that both the TOC's own length and the
    // body's per-heading page indices are known.
    tocEntries.forEach(function(part){
      part.l1s.forEach(function(l1){
        if(l1.tocPgEl) l1.tocPgEl.textContent = tocCount + (l1.bodyPage||0) + 1;
        l1.h1s.forEach(function(h1){
          if(h1 && h1.tocPgEl) h1.tocPgEl.textContent = tocCount + (h1.bodyPage||0) + 1;
        });
      });
    });
    bodyPages.forEach(function(rec, idx){
      rec.pagenoEl.textContent = (tocCount+idx+1) + ' / ' + (tocCount+bodyPages.length);
    });

    // move the finished pages, in true reading order, into the visible stage
    stage.innerHTML = "";
    tocPages.forEach(function(rec){ stage.appendChild(rec.frame); });
    bodyPages.forEach(function(rec){ stage.appendChild(rec.frame); });
  }

  // Decoding every image once, up front, before pagination ever runs is
  // load-bearing, not an optimization: buildUnits()/placeUnit() insert
  // <img> elements one at a time while measuring heights synchronously,
  // and even a same-origin data: URI image isn't guaranteed to report its
  // real naturalHeight the instant it's inserted — there can be a brief
  // async gap before the browser finishes decoding it. During that gap
  // the pagination engine sees a ~0px-tall image, wrongly concludes the
  // page has room, and the image only reveals its true size (overflowing
  // the fixed page box) once it finishes decoding for real later. Decoding
  // every source into a throwaway Image() first means the browser's
  // per-URL image cache already has the real dimensions ready by the time
  // an <img> with that same data: URI is actually inserted during layout.
  function preloadImages(){
    return Promise.all(Object.keys(IMAGES_SRC).map(function(key){
      var img = new Image();
      img.src = IMAGES_SRC[key];
      return img.decode ? img.decode().catch(function(){}) : new Promise(function(res){ img.onload = img.onerror = res; });
    }));
  }

  var fontsReady = (document.fonts && document.fonts.ready)
    ? (document.fonts.load("400 12px 'Noto Sans KR'"), document.fonts.load("700 12px 'Noto Sans KR'"), document.fonts.ready)
    : Promise.resolve();

  Promise.all([fontsReady, preloadImages()]).then(build).catch(build);

  document.querySelector(".nav-jump").addEventListener("click", function(e){
    var btn = e.target.closest("[data-jump]");
    if(!btn) return;
    var key = btn.getAttribute("data-jump");
    var target = null;
    if(key === "toc"){ target = stage.querySelector('.page-frame[data-toc="1"]'); }
    else {
      var wantText = key === "part1" ? "파트1" : "파트2";
      var banners = stage.querySelectorAll(".part-banner");
      for(var i=0;i<banners.length;i++){
        if(banners[i].textContent.indexOf(wantText) === 0){ target = banners[i].closest(".page-frame"); break; }
      }
    }
    if(target) target.scrollIntoView({ behavior:"smooth", block:"start" });
  });
})();
</script>
